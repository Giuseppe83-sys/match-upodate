name: BetStorm agents

# Nessuna esecuzione programmata. Solo anteprima manuale delle quote.
on:
  workflow_dispatch:

jobs:
  telegram_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Anteprima Telegram (nessun invio)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
          BETSTORM_TELEGRAM_SEND: "0"
        run: python telegram_publisher.py
