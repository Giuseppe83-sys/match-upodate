name: BetStorm agents

# Solo bollettino Telegram basato su quote recenti.
# Il workflow delle quote (betstorm.yml) e' separato.
on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC (10:00 Italia ora legale; 09:00 ora solare)
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = anteprima Telegram; send = invio Telegram; email_preview = anteprima newsletter; email_send = invio test a un solo destinatario; email_state_check = verifica registro; email_duplicate_check = verifica blocco duplicati"
        required: true
        type: choice
        options:
          - preview
          - send
          - email_preview
          - email_send
          - email_state_check
          - email_duplicate_check
          - prepare_unsubscribe_test
          - unsubscribe_token_test
          - unsubscribe_link_check
        default: preview

concurrency:
  group: betstorm-telegram
  cancel-in-progress: false

jobs:
  telegram:
    if: github.event_name == 'schedule' || (inputs.mode == 'preview' || inputs.mode == 'send')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Bollettino Telegram (automatico o manuale)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETSTORM_TELEGRAM_SEND: ${{ github.event_name == 'schedule' && '1' || (inputs.mode == 'send' && '1' || '0') }}
        run: python telegram_publisher.py

  email_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'email_preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Anteprima newsletter (nessun invio)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
          BETSTORM_EMAIL_SEND: "0"
        run: python email_notifier.py

  email_send:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'email_send'
    # Serializza i job email anche rispetto ad altri workflow che usano lo stesso gruppo.
    concurrency:
      group: betstorm-newsletter-send
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Verifica un solo destinatario
        env:
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
        run: |
          python - <<'PYCODE'
          import os
          addresses = [a.strip() for a in os.environ.get('NEWSLETTER_RECIPIENTS', '').split(',') if a.strip()]
          if len(addresses) != 1:
              raise SystemExit('Invio bloccato: occorre esattamente un destinatario.')
          print('Destinatario unico confermato, indirizzo non mostrato.')
          PYCODE
      - name: Invia email di prova
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          NEWSLETTER_UNSUBSCRIBE_SECRET: ${{ secrets.NEWSLETTER_UNSUBSCRIBE_SECRET }}
          BETSTORM_EMAIL_SEND: "1"
        run: python email_notifier.py

  email_state_check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'email_state_check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Verifica lettura registro newsletter (nessun invio)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
        run: |
          python - <<'PYCODE'
          import os
          import requests
          base = os.environ['SUPABASE_URL'].rstrip('/')
          bucket = os.environ['SUPABASE_BUCKET']
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          url = f'{base}/storage/v1/object/{bucket}/newsletter_send_state.json'
          headers = {'Authorization': f'Bearer {key}', 'apikey': key}
          response = requests.get(url, headers=headers, timeout=25)
          print('HTTP:', response.status_code)
          response.raise_for_status()
          data = response.json()
          if not isinstance(data, dict):
              raise SystemExit('Registro non valido: atteso oggetto JSON')
          print('Registro newsletter letto correttamente; nessun invio e nessuna modifica.')
          print('Stato:', data.get('status', 'vuoto'))
          PYCODE

  email_duplicate_check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'email_duplicate_check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Verifica blocco duplicati (nessun invio)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime, timezone
          from email_notifier import delivery_key, read_state

          recipients = [x.strip() for x in os.environ.get('NEWSLETTER_RECIPIENTS', '').split(',') if x.strip()]
          if len(recipients) != 1:
              raise SystemExit('Test bloccato: atteso un solo destinatario.')

          now = datetime.now(timezone.utc)
          expected = delivery_key(now, '', recipients)
          state = read_state()
          status = state.get('status')
          same_day = state.get('key') == expected
          print('Data UTC:', now.strftime('%Y-%m-%d'))
          print('Stato registrato:', status or 'assente')
          print('Chiave del giorno corrispondente:', 'SI' if same_day else 'NO')
          if not same_day or status not in ('reserved', 'sent'):
              raise SystemExit('Blocco non verificato: chiave assente/diversa o stato inatteso. Nessun invio eseguito.')
          print('OK: un nuovo invio con la stessa chiave verrebbe bloccato dal codice attuale.')
          print('NESSUNA EMAIL INVIATA; REGISTRO NON MODIFICATO.')
          PYCODE

  prepare_unsubscribe_test:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare_unsubscribe_test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Prepara link disiscrizione solo per destinatario di prova
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEWSLETTER_TEST_EMAIL: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          BETSTORM_PREPARE_UNSUBSCRIBE: "1"
        run: python newsletter_prepare_unsubscribe.py

  unsubscribe_token_test:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'unsubscribe_token_test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Registra token stabile senza inviare email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          NEWSLETTER_UNSUBSCRIBE_SECRET: ${{ secrets.NEWSLETTER_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PYCODE'
          import os
          from email_notifier import prepare_unsubscribe_link

          recipients = [x.strip().lower() for x in os.environ.get('NEWSLETTER_RECIPIENTS', '').split(',') if x.strip()]
          if len(recipients) != 1:
              raise SystemExit('Test bloccato: occorre esattamente un destinatario.')
          # Non stampare il link: contiene un token privato.
          prepare_unsubscribe_link(recipients[0])
          print('OK: token stabile preparato o gia presente; nessuna email inviata.')
          print('Registro invii non modificato. Verificare il conteggio token in Supabase.')
          PYCODE

  unsubscribe_link_check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'unsubscribe_link_check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Verifica GET del link stabile senza disiscrivere
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          NEWSLETTER_UNSUBSCRIBE_SECRET: ${{ secrets.NEWSLETTER_UNSUBSCRIBE_SECRET }}
        run: |
          python - <<'PYCODE'
          import os
          import requests
          from email_notifier import prepare_unsubscribe_link

          recipients = [x.strip().lower() for x in os.environ.get('NEWSLETTER_RECIPIENTS', '').split(',') if x.strip()]
          if len(recipients) != 1:
              raise SystemExit('Test bloccato: occorre un solo destinatario.')
          # Il link contiene un token segreto: mai stamparlo.
          link = prepare_unsubscribe_link(recipients[0])
          response = requests.get(link, timeout=25, allow_redirects=False)
          if response.status_code != 200:
              raise SystemExit(f'Pagina non valida: HTTP {response.status_code}')
          page = response.text.lower()
          if 'conferma disiscrizione' not in page:
              raise SystemExit('Pagina di conferma non riconosciuta.')
          print('OK: il link stabile apre la pagina di conferma (GET).')
          print('Nessuna richiesta POST eseguita; nessuna email inviata.')
          PYCODE
