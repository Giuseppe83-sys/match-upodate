name: BetStorm agents

# Solo bollettino Telegram basato su quote recenti.
# Il workflow delle quote (betstorm.yml) e' separato.
on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC (10:00 Italia ora legale; 09:00 ora solare)
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = anteprima Telegram; send = invio Telegram; email_preview = anteprima newsletter senza invio"
        required: true
        type: choice
        options:
          - preview
          - send
          - email_preview
        default: preview

concurrency:
  group: betstorm-telegram
  cancel-in-progress: false

jobs:
  telegram:
    if: github.event_name == 'schedule' || inputs.mode != 'email_preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Bollettino Telegram (automatico o manuale)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETSTORM_TELEGRAM_SEND: ${{ github.event_name == 'schedule' && '1' || (inputs.mode == 'send' && '1' || '0') }}
        run: python telegram_publisher.py

  email_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'email_preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Anteprima newsletter (nessun invio)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: betstorm-data
          BETSTORM_EMAIL_SEND: "0"
        run: python email_notifier.py
